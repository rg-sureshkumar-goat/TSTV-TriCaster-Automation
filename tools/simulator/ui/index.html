<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TSTV TriCaster Simulator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="banner">
      <strong>SIMULATOR</strong>
      <span>A fake TC1 for practice. Nothing here touches the real switcher.</span>
      <span id="link" class="link">Connecting…</span>
    </header>

    <main>
      <section class="top">
        <div class="monitor">
          <h2>Program</h2>
          <div id="screen" class="screen"></div>
        </div>
        <aside class="card">
          <h2>On air now</h2>
          <dl id="on-air" class="on-air"></dl>
        </aside>
      </section>

      <section class="card controls">
        <div class="control-row">
          <span class="row-label">Cameras</span>
          <div id="cameras" class="buttons"></div>
        </div>
        <div class="control-row">
          <span class="row-label">Green screen</span>
          <div id="green-screen" class="buttons"></div>
        </div>
        <div class="control-row">
          <span class="row-label">DSK 2</span>
          <div id="dsk2" class="buttons"></div>
        </div>
        <div class="control-row">
          <span class="row-label">DDR 2</span>
          <div id="ddr2" class="ddr"></div>
        </div>
        <div class="control-row">
          <span class="row-label">Record</span>
          <div id="record" class="buttons"></div>
        </div>
      </section>

      <section class="card">
        <h2>
          What the show app sent
          <button id="clear-log" class="small">Clear</button>
        </h2>
        <ol id="log" class="log"></ol>
      </section>

      <details class="card practice">
        <summary>Practice problems</summary>
        <div class="practice-body">
          <label><input type="checkbox" id="fault-offline" /> Cable unplugged: the show app can't reach the TC1</label>
          <label><input type="checkbox" id="fault-drop" /> Ignore commands: they arrive but do nothing</label>
          <label>
            Slow replies
            <input type="number" id="fault-latency" min="0" max="10000" step="50" value="0" /> ms
            <button id="apply-latency" class="small">Apply</button>
          </label>
          <label>
            LivePanel password
            <input type="text" id="fault-password" placeholder="none" autocomplete="off" />
            <button id="apply-password" class="small">Apply</button>
          </label>
          <div class="buttons">
            <button id="end-clip">Make the DDR 2 clip end now</button>
            <button id="reset">Reset everything</button>
          </div>
        </div>
      </details>
    </main>

    <script src="app.js"></script>
  </body>
</html>
