# Runs every automated test on a Mac and a Windows machine for each push.
# Free for public repositories.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the website
        run: npm run build -w apps/web
      - name: Browser tests (two people editing one rundown)
        run: |
          npx playwright install chromium
          npm run test:e2e
