# Builds RiGster's installers (Phase 6) on GitHub's free machines: a .dmg for Macs with Apple chips, one
# for Intel Macs, and a Setup .exe for Windows.
#
# - Run by hand (Actions → Build RiGster → Run workflow): just builds them, to download from the run's
#   page and try. Nothing is published.
# - Pushing a version tag like v1.0.1 (the same as apps/show-app/package.json's version): builds them and
#   publishes them as a GitHub Release, which is where RiGster looks for updates.
name: Build RiGster

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, arch: arm64, name: mac-apple-chip }
          - { os: macos-latest, arch: x64, name: mac-intel }
          - { os: windows-latest, arch: x64, name: windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(node -p "require('./apps/show-app/package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run package -w apps/show-app -- --arch=${{ matrix.arch }}
        env:
          # Set in the repository's secrets. Without them, the Macs' installers come out unsigned.
          CSC_LINK: ${{ startsWith(matrix.os, 'macos') && secrets.MAC_CERTIFICATE || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(matrix.os, 'macos') && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: rigster-${{ matrix.name }}
          path: |
            apps/show-app/release/out/*.dmg
            apps/show-app/release/out/*.exe
            apps/show-app/release/out/*.blockmap
            apps/show-app/release/out/latest*.yml
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Apple-chip Mac's latest-mac.yml tells Macs the new version's number (they download by hand).
          # Copies under names that never change, for the website's RiGster tab: …/releases/latest/download/<name>.
          mkdir fixed
          cp out/rigster-mac-apple-chip/*.dmg fixed/RiGster-Mac-Apple-chip.dmg
          cp out/rigster-mac-intel/*.dmg fixed/RiGster-Mac-Intel.dmg
          cp out/rigster-windows/*.exe fixed/RiGster-Windows-Setup.exe
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "RiGster ${GITHUB_REF_NAME#v}" \
            --notes "Download RiGster: Mac with an Apple chip (M1 or newer): RiGster-Mac-Apple-chip.dmg. Intel Mac: RiGster-Mac-Intel.dmg. Windows: RiGster-Windows-Setup.exe. The other files are the same downloads under this version's name, and the files RiGster checks for updates." \
            out/rigster-mac-apple-chip/* out/rigster-mac-intel/*.dmg out/rigster-windows/* fixed/*
